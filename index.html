<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>NEXUS // ARVANDIA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--c:#3ef0e6;--a:#ffb020;--r:#ff3b5c;--v:#b08cff;--ln:rgba(62,240,230,.22)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#03060b;color:#d8f6ff;font-family:Vazirmatn,sans-serif}
body{overflow:hidden}
.mono{font-family:'Share Tech Mono',monospace}
#fxg,#scn,#vg{position:fixed;inset:0;pointer-events:none}
#fxg{z-index:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(62,240,230,.07),transparent 55%),linear-gradient(rgba(62,240,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(62,240,230,.035) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}
#scn{z-index:10;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.08) 2px 4px);opacity:.3;animation:sd 8s linear infinite}
#vg{z-index:9;box-shadow:inset 0 0 160px #000}
@keyframes sd{to{background-position:0 28px}}
@keyframes beam{from{top:-70px}to{top:110%}}
@keyframes live{50%{opacity:.3}}
@keyframes ring{50%{box-shadow:0 0 0 6px rgba(62,240,230,.08)}}
@keyframes shake{30%{transform:translateX(-2px)}60%{transform:translateX(2px)}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #3ef0e6)}}
@keyframes tin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes siren{50%{border-color:rgba(255,176,32,.7)}}
@keyframes wp{50%{color:var(--a)}}
#boot{position:fixed;inset:0;z-index:50;background:#010204;display:grid;place-items:center}
#boot .bm{position:absolute;left:0;right:0;height:70px;background:linear-gradient(180deg,transparent,rgba(62,240,230,.16),transparent);animation:beam 1.6s linear infinite}
.shell{position:relative;z-index:2;height:100dvh;display:grid;grid-template-rows:64px 1fr 46px}
.ht,.hb{display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(#0a141ccc,#04080ecc);border-bottom:1px solid var(--ln)}
.hb{border:0;border-top:1px solid var(--ln)}
.brand b{display:block;color:var(--c);letter-spacing:.35em;font-size:11px}
.brand span{font-size:10px;color:#6f8ea0}
.kpis{display:flex;gap:8px;overflow:auto;flex:1}
.kpi{min-width:76px;padding:6px 8px;background:#08141ccc;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);border:1px solid var(--ln)}
.kpi s{display:block;font-size:9px;color:#7b93a6;text-decoration:none}
.ok b{color:#3dff9a}.warn b{color:var(--a)}.bad b{color:var(--r)}
.stage{display:grid;grid-template-columns:260px 1fr 320px;min-height:0}
.pane{min-height:0;overflow:auto;padding:10px;background:#040a10b8;border-inline-end:1px solid var(--ln)}
.frame{position:relative;padding:10px;margin-bottom:10px;background:#060e16a6;border:1px solid var(--ln)}
.frame:before,.frame:after{content:"";position:absolute;width:12px;height:12px;border:solid var(--c)}
.frame:before{top:-1px;right:-1px;border-width:2px 2px 0 0}
.frame:after{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
.sec{font-size:10px;letter-spacing:.28em;color:var(--c);margin:0 0 8px}
.tree button{width:100%;text-align:right;margin:0 0 5px;background:transparent;color:#cfe;border:1px solid transparent;padding:7px 8px;cursor:pointer}
.tree button.on,.tree button:hover{border-color:var(--c);background:#3ef0e60f}
.lv2{padding-right:14px!important;font-size:13px}
.lv3{padding-right:26px!important;font-size:12px;color:#9fb}
.mapbox{height:230px;background:radial-gradient(circle at 30% 30%,#3ef0e614,transparent 45%),#051018;border:1px solid var(--ln);margin-bottom:10px}
svg.map{width:100%;height:100%}
.poly{fill:#0b2430;stroke:#2c5a68;stroke-width:1.3;cursor:pointer;transition:.25s}
.poly.on,.poly:hover{fill:#123848;stroke:var(--c);animation:glow 1.8s ease-in-out infinite}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.ic{padding:8px;background:#08121ae6;border:1px solid var(--ln)}
.ic .n{font-size:10px;color:#7ea}.ic .v{font-size:18px;font-weight:800}
.meter{height:4px;background:#0a1820;margin-top:6px}
.meter>i{display:block;height:100%;background:var(--c);transition:width .7s}
.meter.warn>i{background:var(--a)}.meter.bad>i{background:var(--r)}
.talk{padding:8px;margin-bottom:8px;border:1px solid var(--ln);background:#0a101ad0}
.talk .who{color:var(--v);font-size:11px}.talk .txt{font-size:13px;line-height:1.7}
.replies{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.nx,.replies button,.tree button{font-family:inherit}
.nx,.replies button{background:#08161ee6;border:1px solid var(--c);color:var(--c);padding:6px 8px;font-size:12px;cursor:pointer}
.nx:hover,.replies button:hover{background:#3ef0e61f;color:#fff}
input,select{width:100%;background:#07141c;border:1px solid var(--ln);color:#fff;padding:6px;font-family:inherit}
.log{font-size:11px;color:#7f9aaa;line-height:1.6}
.tb{position:fixed;left:10px;bottom:56px;z-index:20;display:flex;flex-direction:column;gap:6px}
.tb div{background:#061018;border:1px solid var(--c);padding:8px 10px;font-size:12px;animation:tin .25s ease}
.crit{animation:siren 1s infinite,shake .4s}
@media(max-width:991px){body{overflow:auto}.shell{height:auto;min-height:100dvh}.stage{grid-template-columns:1fr}.desk{display:none!important}.pane{border:0}.ht{flex-wrap:wrap;height:auto;padding:8px}}
@media(min-width:992px){.mob{display:none!important}}
</style>
</head>
<body>
<div id="fxg"></div><div id="scn"></div><div id="vg"></div>
<div id="boot"><div class="bm"></div>
  <div class="text-center"><div class="mono" style="color:var(--c);letter-spacing:.4em;font-size:12px">NEXUS CORE</div>
  <div class="mono" id="bmsg" style="color:#6a8;margin:12px 0">SYNC…</div>
  <div style="width:min(360px,70vw);height:3px;background:#123"><div id="bfill" style="height:100%;width:0;background:var(--c)"></div></div></div>
</div>
<div class="shell" id="app" hidden>
  <header class="ht">
    <button class="nx mob" data-bs-toggle="offcanvas" data-bs-target="#ocL">مناطق</button>
    <div class="brand"><b class="mono">NEXUS</b><span>کنترل زیرساخت آروندیا</span></div>
    <div class="kpis" id="kpis"></div>
    <div class="mono small text-end"><div id="daylbl"></div><div style="color:var(--a);animation:live 1.4s infinite">● LIVE</div></div>
    <button class="nx mob" data-bs-toggle="offcanvas" data-bs-target="#ocR">فرمان</button>
  </header>
  <div class="stage">
    <aside class="pane desk" id="leftDesk"></aside>
    <main class="pane" style="border:0">
      <div class="mapbox" id="mapbox"><svg class="map" viewBox="0 0 400 280" id="svgmap"></svg></div>
      <div class="frame"><div class="sec" id="regtitle">کل کشور</div><div class="grid" id="dash"></div></div>
      <div class="frame"><div class="sec">پیامد زنجیره‌ای</div><div class="log" id="chain"></div></div>
      <div class="frame"><div class="sec">اقتصاد زنده</div><div class="grid" id="eco"></div></div>
    </main>
    <aside class="pane desk" id="rightDesk"></aside>
  </div>
  <footer class="hb">
    <span id="warns" class="text-truncate">—</span>
    <div class="ms-auto d-flex gap-1">
      <button class="nx" onclick="saveGame()">ذخیره</button>
      <button class="nx" onclick="loadGame()">بارگذاری</button>
      <button class="nx" onclick="newGame()">جدید</button>
      <button class="nx" data-bs-toggle="modal" data-bs-target="#tut">آموزش</button>
    </div>
  </footer>
</div>
<div class="offcanvas offcanvas-end text-bg-dark" id="ocL"><div class="offcanvas-header"><b>مناطق</b><button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="leftMob"></div></div>
<div class="offcanvas offcanvas-start text-bg-dark" id="ocR"><div class="offcanvas-header"><b>COMMAND</b><button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="rightMob"></div></div>
<div class="modal fade" id="tut"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-light border-info p-3">
  <h6 style="color:var(--c)">ورود به هسته</h6>
  <p class="small">هویت مخفی است. منطقه را قفل کنید، شدت را عوض کنید. صفحه هر ساعت رفرش کامل نمی‌شود؛ فقط عقربه‌ها و حرف مردم زنده عوض می‌شود.</p>
  <button class="nx" data-bs-dismiss="modal">ادامه</button>
</div></div></div>
<div class="tb" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SYS=['برق','آب','گاز','سوخت','اینترنت','موبایل','حمل‌ونقل','بانک','پسماند','درمان','توزیع کالا'];
const KEY=['power','water','gas','fuel','net','mobile','transit','bank','waste','health','supply'];
const COUNTRY={id:'ARV',name:'آروندیا',kids:[
  {id:'N',name:'شمال‌آبی',kids:[{id:'N1',name:'بندرخیز'},{id:'N2',name:'مهردشت'},{id:'N3',name:'سفیدکوه'}]},
  {id:'C',name:'مرکزی',kids:[{id:'C1',name:'آروندشهر'},{id:'C2',name:'فولادان'},{id:'C3',name:'دشت‌نور'}]},
  {id:'S',name:'جنوب‌گرم',kids:[{id:'S1',name:'نفت‌سان'},{id:'S2',name:'نخلستان'},{id:'S3',name:'جزیره مرجان'}]},
  {id:'E',name:'شرق‌کوه',kids:[{id:'E1',name:'معدن‌پایه'},{id:'E2',name:'یخ‌رود'}]}]};
const POLYS={N:'M40,20 L180,18 L170,90 L30,95 Z',C:'M170,90 L250,80 L240,170 L80,175 L30,95 Z',S:'M80,175 L240,170 L260,250 L50,255 Z',E:'M250,80 L370,40 L380,160 L240,170 Z'};
const REGS=(()=>{const a=[{id:'ARV',name:'کل کشور',lv:0}];COUNTRY.kids.forEach(p=>{a.push({id:p.id,name:p.name,lv:1,par:'ARV'});p.kids.forEach(c=>a.push({id:c.id,name:c.name,lv:2,par:p.id}));});return a})();
const base=()=>Object.fromEntries(KEY.map(k=>[k,100]));
let S={day:1,hour:8,tick:0,sel:'ARV',infra:{},eco:{gdp:100,prices:100,unemp:8,stock:92},mood:72,hist:[],queue:[],talks:[],events:[],alerts:[],mem:[],lastCause:null};
REGS.forEach(r=>S.infra[r.id]=base());
let uiReady=false;
let AC;const ac=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function beep(f,d,t='square',g=.05,sl=0){try{const c=ac(),o=c.createOscillator(),n=c.createGain();o.type=t;o.frequency.value=f;n.gain.value=g;o.connect(n);n.connect(c.destination);o.start();if(sl)o.frequency.linearRampToValueAtTime(f+sl,c.currentTime+d);n.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
const play=n=>({click:()=>beep(700,.04),ok:()=>{beep(520,.07,'sine');setTimeout(()=>beep(760,.09,'sine'),70)},warn:()=>beep(170,.18,'sawtooth',.06),alert:()=>{beep(420,.12);setTimeout(()=>beep(260,.16),120)},cmd:()=>beep(150,.1,'square',.06,280),tick:()=>beep(900,.02,'square',.015),chat:()=>beep(640,.04,'sine',.03),out:()=>beep(90,.35,'sawtooth',.07,-30),up:()=>beep(300,.08,'triangle',.05,220)}[n]||(()=>{}))();
const ids=sel=>sel==='ARV'?REGS.map(r=>r.id):[sel,...REGS.filter(r=>r.par===sel).map(r=>r.id)];
const avg=(k,sel)=>{const a=ids(sel);return Math.round(a.reduce((s,i)=>s+S.infra[i][k],0)/a.length)};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const nm=id=>(REGS.find(r=>r.id===id)||{}).name||id;
const sn=k=>SYS[KEY.indexOf(k)]||k;
const tone=v=>v<35?'bad':v<65?'warn':'ok';
const pad=n=>String(n).padStart(2,'0');
const pick=a=>a[Math.floor(Math.random()*a.length)];
function cascade(list){list.forEach(id=>{const I=S.infra[id];
  if(I.power<40){I.water=Math.min(I.water,I.power+25);I.net=Math.min(I.net,I.power+15);I.transit=Math.min(I.transit,I.power+20);I.bank=Math.min(I.bank,I.power+30);I.health=Math.min(I.health,I.power+20)}
  if(I.water<35){I.health=Math.min(I.health,I.water+25);I.supply=Math.min(I.supply,I.water+30)}
  if(I.fuel<40){I.transit=Math.min(I.transit,I.fuel+15);I.supply=Math.min(I.supply,I.fuel+20)}
  if(I.net<30){I.bank=Math.min(I.bank,I.net+20);I.mobile=Math.min(I.mobile,I.net+25)}
  if(I.waste<40){I.health=Math.min(I.health,I.waste+35)}
})}
function eco(){const infra=(avg('power','ARV')+avg('water','ARV')+avg('fuel','ARV')+avg('net','ARV')+avg('health','ARV')+avg('supply','ARV'))/6;
  S.eco.gdp=clamp(S.eco.gdp+(infra-70)*.04-(100-S.mood)*.01,20,160);
  S.eco.prices=clamp(S.eco.prices+(100-avg('supply','ARV'))*.03+(100-avg('fuel','ARV'))*.02,70,220);
  S.eco.unemp=clamp(S.eco.unemp+(70-infra)*.02,3,40);
  S.eco.stock=clamp(S.eco.stock+(avg('supply','ARV')-80)*.05-(S.eco.prices-100)*.02,10,100);
  S.mood=clamp(S.mood-((100-infra)*.012+(S.eco.prices-100)*.004+(S.eco.unemp-8)*.03)+(infra>85?.2:0),5,98)}
function cons(cmd){const o={short:[],mid:[],lon:[]};
  if(cmd.sys==='power'&&cmd.val<50){o.short=['چراغ و آسانسور خوابید'];o.mid=['خط تولید کم‌کار شد'];o.lon=['اعتماد به برق می‌ریزد']}
  else if(cmd.sys==='net'&&cmd.val<40){o.short=['کارتخوان قفل شد'];o.mid=['دورکاری خوابید'];o.lon=['کسب‌وکار کوچ می‌کند']}
  else if(cmd.sys==='fuel'&&cmd.val<50){o.short=['صف جایگاه آمد'];o.mid=['کرایه بار بالا رفت'];o.lon=['لجستیک قفل می‌شود']}
  else if(cmd.sys==='water'&&cmd.val<45){o.short=['فشار شیر افتاد'];o.mid=['بهداشت محله ضعیف شد'];o.lon=['مهاجرت از منطقه']}
  else {o.short=['ظرفیت جابه‌جا شد'];o.mid=['مصرف تنظیم می‌شود'];o.lon=['در حافظه ماند']}
  return o}
const PPL=[{n:'رعنا',job:'پرستار',need:'health'},{n:'کیان',job:'راننده',need:'fuel'},{n:'نادر',job:'بقّال',need:'supply'},{n:'سارا',job:'دانشجو',need:'net'},{n:'بهرام',job:'کارگر کارخانه',need:'power'},{n:'لیلا',job:'مادر',need:'water'},{n:'آرمان',job:'دورکار آی‌تی',need:'net'},{n:'مهسا',job:'معلم',need:'transit'},{n:'پوریا',job:'اسکله‌چی',need:'fuel'},{n:'ستایش',job:'داروخانه‌دار',need:'health'}];
const worst=I=>KEY.map(k=>({k,v:I[k]})).sort((a,b)=>a.v-b.v)[0];
const when=()=>{const h=S.hour;return h<5?'نصف‌شب':h<8?'اذان‌صبح':h<12?'صبح':h<16?'ظهر':h<20?'عصر':'شب'};
const memHas=s=>S.mem.slice(-16).some(x=>String(x).includes(s));
function causeLine(){const c=S.lastCause;if(!c)return '';
  if(c.type==='cmd') return `از وقتی ${sn(c.sys)} ${c.reg} رفت روی ${c.val}٪، `;
  if(c.type==='event') return `بعدِ «${c.n}»، `;
  if(c.type==='reply') return ({ignore:'دفه پیش مرکز جواب نداد. ',warn:'با لحن اخطار که درست نمی‌شه. ',aid:'کمک اومد ولی کم بود. ',calm:'گفتن آروم باشیم. '}[c.kind]||'');
  return ''}
function talkLines(p,city){
  const I=S.infra[city.id],w=worst(I),pre=causeLine(),t=when();
  const pack={
    power:[[`${t}ه برق پرید. آسانسور بین طبقه موند.`,`همسایه با شمع اومده راهرو. یخچال آب می‌ده.`],[`شیفت کارخونه نصف شد؛ دستگاه خاموشه.`,`سرپرست می‌گه اگه نیاد حقوق قطع می‌شه.`]],
    water:[[`شیر فقط سوت می‌کشه. دبه پر کردم برای بچه‌ها.`,`حمام بی‌خیال؛ بو اومده از چاه.`],[`مدرسه آبخوری‌ها رو بست.`,`می‌گن فردا جیره‌بندی می‌شه.`]],
    fuel:[[`جایگاه نوشته سهمیه تمام. باک روی رزروه‌ست.`,`کرایه دو برابر شده، مسافر پیاده می‌شه.`],[`وانت بار نزده. گوجه تو صندوق داره نرم می‌شه.`,`اسکله گازوئیل نمی‌ده.`]],
    net:[[`پینگ چند هزاره. کلاس قطع‌قطع می‌شه.`,`استاد حضور رو از روی نت می‌زنه؛ یعنی غیبت.`],[`کارتخوان بوق خطا. مشتری کارت، من نقد.`,`قبض هم پرداخت نمی‌شه.`]],
    health:[[`اورژانس تخت نداره. ژنراتور سرفه می‌کنه.`,`آنتی‌بیوتیک سهمیه‌ایه.`],[`داروخانه فقط مسکن می‌ده. سرم تمومه.`,`شیفت قبل با چشم گریان رفت.`]],
    supply:[[`قفسه روغن خالیه. برنج زیر پیشخوانه.`,`با این قیمت نمی‌صرفد جنس بیارم.`],[`نانوایی صف شده تا خیابون بعدی.`,`بچه می‌پرسه گوشت کو.`]],
    transit:[[`مترو هر ربع می‌ایسته. اتوبوس جا نداره.`,`تاکسی مسیر نمی‌ره، می‌گه سوخت نمی‌ارزه.`],[`خروجی شهر قفل شده. زنگ مدرسه دیر می‌خوره.`]],
    bank:[[`عابربانک پول نمی‌ده. اپ می‌چرخه.`,`حقوق اومده ولی دستم بهش نمی‌رسه.`]],
    gas:[[`شعله آبگرمکن زرد شده.`,`غذا نیم‌پز موند روی اجاق.`]],
    mobile:[[`آنتن یکی‌درمیونه. تماس اورژانس قطع شد.`,`پیامک هم دیر می‌رسه.`]],
    waste:[[`سطل‌ها بو گرفتن. ماشین جمع‌آوری نیومد.`,`فاضلاب بازه، پشه ریخته.`]]
  };
  const key=I[p.need]<70?p.need:(w.v<70?w.k:'ok');
  let a,b;
  if(key==='ok'|| (w.v>=80 && S.mood>74)) [a,b]=pick([[`${t} پایدارتره. چراغ نپرید.`,`فقط فردا پشیمون نشید.`],[`نت کشید، کار راه افتاد.`,`محله می‌گه شاید دست‌تون درد نکنه.`]]);
  else [a,b]=pick(pack[key]||pack.power);
  a=pre+a;
  if(memHas('بی‌توجهی')) b='دفعه قبل هیچی نگفتین. '+b;
  if(memHas('کمک فوری')&&Math.random()>.45) b='کمک قبلی رسید، یادمون هست. '+b;
  if(key!=='ok'&&I[key]<25) b+=' این دیگه اختلال نیست، تعطیلیه.';
  if(S.eco.prices>150&&key!=='supply') b+=' تازه گرونی جداست.';
  return [a,b];
}
function genTalks(){const cities=REGS.filter(r=>r.lv===2),out=[];
  for(let i=0;i<4;i++){const c=pick(cities),p=pick(PPL),[a,b]=talkLines(p,c);
    out.push({id:'t'+S.tick+'-'+i,who:`${p.n} · ${p.job} — ${c.name}`,text:a+'\n'+b,city:c.id})}
  S.talks=out; if(uiReady) play('chat')}
function execCmd(cmd){ids(cmd.region).forEach(id=>S.infra[id][cmd.sys]=cmd.val);cascade(ids(cmd.region));
  cmd.cons=cons(cmd);S.hist.unshift(cmd);if(S.hist.length>80)S.hist.pop();
  S.mem.push(cmd.sys+'@'+cmd.region+'='+cmd.val);S.mem=S.mem.slice(-40);
  S.lastCause={type:'cmd',sys:cmd.sys,val:cmd.val,reg:nm(cmd.region)};
  if(cmd.val<30){S.alerts.push('بحرانی: '+sn(cmd.sys));play('out');mapbox.classList.add('crit');setTimeout(()=>mapbox.classList.remove('crit'),1200)} else play('cmd');
  eco();toast(sn(cmd.sys)+' → '+cmd.val+'٪ / '+nm(cmd.region));genTalks();paintTalks()}
function replyTalk(id,kind){const t=S.talks.find(x=>x.id===id);
  if(kind==='calm'){S.mood=clamp(S.mood+1,5,98);S.mem.push('آرام‌سازی');play('ok')}
  if(kind==='aid'){if(t)['water','supply','health'].forEach(k=>S.infra[t.city][k]=clamp(S.infra[t.city][k]+8,0,100));S.mood=clamp(S.mood+2.1,5,98);S.mem.push('کمک فوری');play('up')}
  if(kind==='ignore'){S.mood=clamp(S.mood-2.6,5,98);S.mem.push('بی‌توجهی');play('warn')}
  if(kind==='warn'){S.mood=clamp(S.mood-1.1,5,98);S.mem.push('هشدار');play('alert')}
  S.lastCause={type:'reply',kind};genTalks();paintSoft();paintTalks()}
function valOf(sel){return (document.querySelector('#rightDesk '+sel)||document.querySelector('#rightMob '+sel))}
function readCmd(){return {t:S.day+':'+S.hour,region:S.sel,sys:valOf('.js-sys').value,val:+valOf('.js-inten').value,delay:+valOf('.js-delay').value||0}}
function queueCmd(){S.queue.push({...readCmd(),done:false});play('click');paintQueue()}
function execNow(){execCmd(readCmd());paintSoft()}
function undoLast(){const L=S.hist[0];if(!L)return;ids(L.region).forEach(id=>{S.infra[id][L.sys]=clamp(L.val+(100-L.val)*.5,0,100)});S.hist.shift();play('up');paintSoft()}
function randEvent(){if(Math.random()>0.22)return;
  const pool=[{n:'خرابی توربین نیروگاه مرکزی',fn(){S.infra.C.power-=35;S.infra.C1.power-=40}},{n:'موج گرما جنوب‌گرم',fn(){ids('S').forEach(i=>{S.infra[i].water-=15;S.infra[i].power-=10})}},{n:'قطع کابل دریایی',fn(){S.infra.S3.net=10;S.infra.S.net=30}},{n:'کمبود سوخت نفت‌سان',fn(){S.infra.S1.fuel=25;S.infra.S.fuel=40}},{n:'ازدحام مترو پایتخت',fn(){S.infra.C1.transit=35}},{n:'خشکسالی دشت‌نور',fn(){S.infra.C3.water=28;S.infra.C3.supply=40}},{n:'نقص تصفیه‌خانه مهردشت',fn(){S.infra.N2.waste=30;S.infra.N2.health=45}}];
  const e=pick(pool);e.fn();cascade(REGS.map(r=>r.id));S.events.unshift({t:`روز ${S.day} ${pad(S.hour)}:۰۰`,n:e.n});S.alerts.push(e.n);S.lastCause={type:'event',n:e.n};play('alert');toast('رویداد: '+e.n);genTalks();paintTalks()}
function advance(){S.hour++;S.tick++;if(S.hour>=24){S.hour=0;S.day++}
  S.queue.forEach(q=>{if(!q.done){q.delay--;if(q.delay<=0){execCmd(q);q.done=true}}});S.queue=S.queue.filter(q=>!q.done);
  if(S.tick%3===0)eco();if(S.tick%5===0){genTalks();paintTalks()}if(S.hour===7||S.hour===19)randEvent();
  if(S.mood>80&&S.tick%6===0)REGS.forEach(r=>KEY.forEach(k=>S.infra[r.id][k]=clamp(S.infra[r.id][k]+.3,0,100)));
  play('tick');paintSoft()}
function eventText(){return S.events.slice(0,5).map(e=>e.t+' — '+e.n).join('<br>')||'آرام'}
function histText(){return S.hist.slice(0,8).map(h=>`${h.t} | ${nm(h.region)} | ${sn(h.sys)} ${h.val}٪`).join('<br>')||'—'}
function queueText(){return S.queue.length?S.queue.map(q=>`⏳ ${sn(q.sys)} ${q.val}٪ ${nm(q.region)} ${q.delay}h`).join('<br>'):'صف خالی'}
function leftHTML(){let h='<div class="frame"><div class="sec">هدف‌گیری منطقه</div><div class="tree">';
  h+=`<button class="${S.sel==='ARV'?'on':''}" data-sel="ARV">کل کشور</button>`;
  COUNTRY.kids.forEach(p=>{h+=`<button class="lv2 ${S.sel===p.id?'on':''}" data-sel="${p.id}">${p.name}</button>`;
    p.kids.forEach(c=>h+=`<button class="lv3 ${S.sel===c.id?'on':''}" data-sel="${c.id}">${c.name}</button>`)});
  return h+`</div></div><div class="frame"><div class="sec">رویداد</div><div class="log" id="evlog">${eventText()}</div></div><div class="frame"><div class="sec">تاریخچه</div><div class="log" id="hilog">${histText()}</div></div>`}
function rightHTML(){const sys=KEY.map((k,i)=>`<option value="${k}">${SYS[i]}</option>`).join('');
  return `<div class="frame"><div class="sec">COMMAND</div><div class="small mb-1" style="color:#7ea">سیستم</div><select class="js-sys mb-2">${sys}</select>
    <div class="small mb-1" style="color:#7ea">سطح سرویس</div><input type="range" min="0" max="100" value="100" class="js-inten">
    <div class="mono js-ilbl" style="color:var(--a)">۱۰۰٪</div>
    <div class="small mb-1 mt-2" style="color:#7ea">تأخیر ساعتی</div><input type="number" min="0" max="48" value="0" class="js-delay mb-2">
    <div class="d-grid gap-2"><button class="nx" data-act="q">صف فرمان</button><button class="nx" data-act="go" style="animation:ring 2.2s infinite">اجرای فوری</button><button class="nx" data-act="undo">بازگشت</button></div>
    <div class="log mt-2" id="qlog">${queueText()}</div></div><div class="frame"><div class="sec">فرکانس شهروند</div><div id="talks"></div></div>`}
function bindPane(root){root.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;play('click');paintChrome()});
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(b.dataset.act==='q')queueCmd();if(b.dataset.act==='go')execNow();if(b.dataset.act==='undo')undoLast()});
  const sl=root.querySelector('.js-inten');if(sl)sl.oninput=()=>{root.querySelector('.js-ilbl').textContent=sl.value+'٪';document.querySelectorAll('.js-inten').forEach(x=>{if(x!==sl)x.value=sl.value});document.querySelectorAll('.js-ilbl').forEach(x=>x.textContent=sl.value+'٪')}}
function mountSides(){const L=leftHTML(),R=rightHTML();leftDesk.innerHTML=L;leftMob.innerHTML=L;rightDesk.innerHTML=R;rightMob.innerHTML=R;[leftDesk,leftMob,rightDesk,rightMob].forEach(bindPane);paintTalks()}
function paintChrome(){document.querySelectorAll('[data-sel]').forEach(b=>b.classList.toggle('on',b.dataset.sel===S.sel));regtitle.textContent=nm(S.sel);renderMap();paintDash()}
function paintDash(){dash.innerHTML=KEY.map((k,i)=>{const v=avg(k,S.sel);return `<div class="ic"><div class="n">${SYS[i]}</div><div class="v ${tone(v)}">${v}٪</div><div class="meter ${tone(v)}"><i style="width:${v}%"></i></div></div>`}).join('');
  const last=S.hist[0],c=last&&last.cons?last.cons:{short:['فرمانی نیست'],mid:['—'],lon:['—']};
  chain.innerHTML=`کوتاه: ${c.short.join('؛ ')}<br>میان: ${c.mid.join('؛ ')}<br>بلند: ${c.lon.join('؛ ')}`;
  eco.innerHTML=`<div class="ic"><div class="n">تولید</div><div class="v">${S.eco.gdp.toFixed(0)}</div></div><div class="ic"><div class="n">قیمت</div><div class="v ${S.eco.prices>130?'bad':''}">${S.eco.prices.toFixed(0)}</div></div><div class="ic"><div class="n">بیکاری</div><div class="v">${S.eco.unemp.toFixed(1)}٪</div></div><div class="ic"><div class="n">موجودی</div><div class="v">${S.eco.stock.toFixed(0)}٪</div></div><div class="ic"><div class="n">رضایت</div><div class="v ${tone(S.mood)}">${S.mood.toFixed(0)}</div><div class="meter ${tone(S.mood)}"><i style="width:${S.mood}%"></i></div></div>`}
function paintTalks(){const html=S.talks.map(t=>`<div class="talk"><div class="who">${t.who}</div><div class="txt">${t.text.replace(/\n/g,'<br>')}</div><div class="replies"><button onclick="replyTalk('${t.id}','calm')">آروم‌شون کن</button><button onclick="replyTalk('${t.id}','aid')">کمک بفرست</button><button onclick="replyTalk('${t.id}','warn')">اخطار بده</button><button onclick="replyTalk('${t.id}','ignore')">بی‌خیال شو</button></div></div>`).join('');
  document.querySelectorAll('#talks').forEach(el=>el.innerHTML=html)}
function paintQueue(){document.querySelectorAll('#qlog').forEach(el=>el.innerHTML=queueText());document.querySelectorAll('#evlog').forEach(el=>el.innerHTML=eventText());document.querySelectorAll('#hilog').forEach(el=>el.innerHTML=histText())}
function paintSoft(){daylbl.textContent=`روز ${S.day} — ${pad(S.hour)}:۰۰`;
  kpis.innerHTML=`<div class="kpi ${tone(S.mood)}"><s>رضایت</s><b>${S.mood.toFixed(0)}</b></div><div class="kpi ${tone(avg('power','ARV'))}"><s>برق</s><b>${avg('power','ARV')}٪</b></div><div class="kpi ${tone(avg('net','ARV'))}"><s>شبکه</s><b>${avg('net','ARV')}٪</b></div><div class="kpi ${S.eco.prices>130?'bad':'ok'}"><s>قیمت</s><b>${S.eco.prices.toFixed(0)}</b></div>`;
  const w=S.alerts.slice(-2).join(' • ');warns.innerHTML=w?`<span style="color:var(--r);animation:wp 1s infinite">⚠ ${w}</span>`:'شبکه پایدار';paintDash();paintQueue()}
function renderMap(){svgmap.innerHTML=Object.entries(POLYS).map(([id,d])=>{const on=S.sel===id||S.sel==='ARV'||REGS.find(r=>r.id===S.sel)?.par===id;return `<path class="poly ${on?'on':''}" d="${d}" data-sel="${id}"/>`}).join('')+`<text x="68" y="54" fill="#8cf" font-size="11">شمال‌آبی</text><text x="118" y="128" fill="#8cf" font-size="11">مرکزی</text><text x="128" y="214" fill="#8cf" font-size="11">جنوب‌گرم</text><text x="288" y="108" fill="#8cf" font-size="11">شرق‌کوه</text>`;
  svgmap.querySelectorAll('[data-sel]').forEach(p=>p.onclick=()=>{S.sel=p.getAttribute('data-sel');play('click');paintChrome()})}
function toast(m){const d=document.createElement('div');d.textContent=m;toasts.prepend(d);setTimeout(()=>d.remove(),2800)}
function saveGame(){localStorage.setItem('nexus_arv',JSON.stringify(S));toast('ذخیره شد');play('ok')}
function loadGame(){const x=localStorage.getItem('nexus_arv');if(!x)return toast('ذخیره‌ای نیست');S=JSON.parse(x);mountSides();paintSoft();paintChrome();toast('بارگذاری شد')}
function newGame(){location.reload()}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
let bootn=0;const bi=setInterval(()=>{bootn+=25;bfill.style.width=bootn+'%';bmsg.textContent=['CRYPTO','GRID LINK','CIVIL SENSOR','READY'][Math.min(3,bootn/25|0)];
  if(bootn>=100){clearInterval(bi);document.getElementById('boot').hidden=true;app.hidden=false;genTalks();mountSides();paintSoft();paintChrome();uiReady=true;new bootstrap.Modal('#tut').show();setInterval(advance,4500)}},160);
</script>
</body>
</html>
